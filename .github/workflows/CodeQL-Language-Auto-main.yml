name: CodeQL + Translator Interactions

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 3"  # every Wednesday at midnight

jobs:
  analyze-and-interact:
    name: CodeQL Analysis & Translated Interactions
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Initialize CodeQL using UIL config
      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@v4
        with:
          config-file: ./.github/codeql/codeql-config.yml

      # Step 3: Verify detected languages
      - name: Verify detected languages
        run: |
          echo "Detected languages: ${{ steps.init.outputs.languages }}"
          if [ -z "${{ steps.init.outputs.languages }}" ]; then
            echo "No detectable languages found. Skipping analysis."
            exit 0
          fi

      # Step 4: Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      # Step 5: Translator Interaction between Agent, Teacher, and Social Worker
      - name: Translator Interactions
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
        run: |
          AGENT_MSG="Please review the student report."
          echo "Agent says: $AGENT_MSG"

          TEACHER_MSG=$(curl -s -X POST "https://api.deepl.com/v2/translate" \
            -d "auth_key=$TRANSLATE_API_KEY" \
            -d "text=$AGENT_MSG" \
            -d "target_lang=ES" | jq -r '.translations[0].text')
          echo "Teacher receives: $TEACHER_MSG"

          TEACHER_REPLY="Report reviewed, feedback added."
          echo "Teacher says: $TEACHER_REPLY"

          SOCIAL_WORKER_MSG=$(curl -s -X POST "https://api.deepl.com/v2/translate" \
            -d "auth_key=$TRANSLATE_API_KEY" \
            -d "text=$TEACHER_REPLY" \
            -d "target_lang=FR" | jq -r '.translations[0].text')
          echo "Social Worker receives: $SOCIAL_WORKER_MSG"

          echo "Generating voice output... (integration with TTS service here)"
fix: align CodeQL with UIL architecture and disable JS scanning
